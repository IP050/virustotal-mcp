[project]
name = "vt-mcp"
version = "0.9.9"
description = "VirusTotal intelligence for MCP clients, powered by VTAI"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "LICENSES/MIT.txt"]
authors = [{name = "VirusTotal"}]
dependencies = [
    "anyio>=4.15.1,<5",
    "httpx>=0.28.1,<0.29",
    "mcp==2.1.1",
    "pydantic>=2.13.5,<3",
]

[project.urls]
Homepage = "https://ai.virustotal.com"
Documentation = "https://ai.virustotal.com/install.md"
Repository = "https://github.com/VirusTotal/virustotal-mcp"
Issues = "https://github.com/VirusTotal/virustotal-mcp/issues"

[project.scripts]
vt-mcp = "vt_mcp.__main__:main"

[build-system]
requires = ["uv_build==0.12.10"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
    "ruff>=0.16.6,<0.17",
    "twine>=6,<7",
    "uv_build==0.12.10",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv.build-backend]
source-include = [
    "server.json",
    "gemini-extension.json",
    "glama.json",
    "docs/discovery.md",
    "docs/access.md",
    "docs/clients.md",
    "docs/claude-code.md",
    "docs/hosted-clients.md",
    "docs/google-clients.md",
    "docs/publishing.md",
    "docs/client-validation-2026-09-07.md",
    "docs/analysis.md",
    "docs/control.md",
    "docs/embedding.md",
    "docs/ci-pilot.md",
    "docs/releases/*.md",
    "examples/**",
]
